<svg xmlns="http://www.w3.org/2000/svg" width="430" height="530" viewBox="0 0 430 530" role="img" aria-labelledby="title desc">
  <title id="title">Animated Michigan M</title>
  <desc id="desc">A block M changes every five seconds between maize on blue and blue on maize.</desc>
  <style>
    .background { animation: backgroundFlip 10s steps(1, end) infinite; }
    .mark { animation: markFlip 10s steps(1, end) infinite; }
    .border { animation: borderFlip 10s steps(1, end) infinite; }
    @keyframes backgroundFlip {
      0%, 49.999% { fill: #00274C; }
      50%, 100% { fill: #FFCB05; }
    }
    @keyframes markFlip {
      0%, 49.999% { fill: #FFCB05; }
      50%, 100% { fill: #00274C; }
    }
    @keyframes borderFlip {
      0%, 49.999% { stroke: #FFCB05; }
      50%, 100% { stroke: #00274C; }
    }
  </style>
  <rect class="background" width="430" height="530" rx="22" fill="#00274C"/>
  <rect class="border" x="3" y="3" width="424" height="524" rx="19" fill="none" stroke="#FFCB05" stroke-width="6"/>
  <path class="mark" fill="#FFCB05" d="M55 390V140h82l78 128 78-128h82v250h-80V270l-80 126-80-126v120H55zm80-178v18l80 126 80-126v-18h-36l-44 72-44-72h-36z"/>
</svg>
